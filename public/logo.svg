<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Jadranko">
  <!--
    Organization logo, referenced by the JSON-LD in src/lib/seo.ts.
    Google wants a square-ish, self-contained mark, so this repeats the
    stencilled register-box from the site header on an opaque ground
    rather than reusing the transparent inline wordmark.

    Placeholder brand: the letter and colours track src/config/site.ts
    and the @theme block. Replace both together when the brand is set.
  -->
  <rect width="512" height="512" fill="#141414"/>
  <rect x="128" y="128" width="256" height="256" fill="none" stroke="#FF4D00" stroke-width="20"/>
  <text x="256" y="256" fill="#FF4D00" font-family="Archivo, Arial, Helvetica, sans-serif"
        font-size="150" font-weight="700" text-anchor="middle" dominant-baseline="central">J</text>
</svg>
